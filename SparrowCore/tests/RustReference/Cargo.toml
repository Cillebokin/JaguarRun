[package]
name = "sparrow-rust-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
itertools = "0.15"
jagua-rs = { default-features = false, features = ["spp"], version = "0.9.0", git = "https://github.com/JeroenGar/jagua-rs", branch = "jg-explicit-rotations-v0.9" }
rand = "0.10"
rand_distr = "0.6"
sparrow = { default-features = false, path = "../../../CodeResource/sparrow", features = ["oracle-trace"] }
